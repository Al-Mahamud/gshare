name: gshare
description: "Share files, photos, videos and text between phones and computers on the same Wi-Fi or hotspot. No internet, no accounts."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  basic_utils: ^5.7.0
  crypto: ^3.0.3
  file_picker: ^13.1.0
  gal: ^2.3.0
  mobile_scanner: ^5.2.3
  nsd: ^4.0.0
  open_filex: ^4.5.0
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
